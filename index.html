    <script>
      // Shield against opaque cross-origin script errors (e.g. from third-party widgets)
      window.addEventListener('error', function(event) {
        if (!event || event.message === 'Script error.' || (typeof event.message === 'string' && event.message.includes('Script error'))) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopPropagation) event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && typeof event.reason === 'string' && event.reason.includes('Script error')) {
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      });
      window.onerror = function(msg) {
        if (msg === 'Script error.' || (typeof msg === 'string' && msg.includes('Script error'))) {
          return true;
        }
      };
    </script>
  </head>

  </body>
